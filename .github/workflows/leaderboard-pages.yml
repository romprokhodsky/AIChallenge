# Builds `leaderboard/` and deploys to GitHub Pages (same repo).
# Requirements: Settings → Pages → Build and deployment: GitHub Actions.
name: Deploy leaderboard to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  # Let in-flight deployments finish so Pages never ends up without a successful artifact
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json
      # Pass repo + Pages base_path explicitly so Vite `base` always matches the deployed URL
      - name: Install and build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          cd leaderboard
          npm ci
          npm run build
      - name: Verify build output
        run: |
          test -f leaderboard/dist/index.html
          ls -la leaderboard/dist
      # Same markup as index.html — GitHub Pages serves this for unknown paths (SPA refresh/bookmarks)
      - name: Copy index.html to 404.html
        run: cp leaderboard/dist/index.html leaderboard/dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard/dist
          # Default excludes dotfiles; we need .nojekyll so Pages does not run Jekyll on the Vite output.
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
