# Builds `leaderboard/` and publishes static files to the `gh-pages` branch.
# GitHub Pages then serves that branch at https://<user>.github.io/<repo>/
#
# One-time (repo owner): Settings → Pages → Build and deployment → Source:
#   "Deploy from a branch" → Branch: gh-pages → Folder: / (root)
# (If Source was "GitHub Actions", switch to the branch above — otherwise GitHub
# keeps looking for index.html in the repo root and shows 404.)
name: Deploy leaderboard to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json

      - name: Install and build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Project site path must match repo name (same as configure-pages base_path)
          VITE_BASE_PATH: ${{ format('/{0}/', github.event.repository.name) }}
        run: |
          set -e
          cd leaderboard
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          # Ensure Jekyll is skipped on Pages (Vite may omit dotfiles from public/)
          if [ -f public/.nojekyll ]; then cp public/.nojekyll dist/.nojekyll; else touch dist/.nojekyll; fi
          test -f dist/index.html
          ls -la dist

      - name: Push dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./leaderboard/dist
          force_orphan: true
