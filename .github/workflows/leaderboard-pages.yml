# Builds `leaderboard/` and deploys in two ways so the site stays up regardless of Pages settings:
# 1) GitHub Actions → Pages (upload-pages-artifact + deploy-pages) — use Settings → Source: GitHub Actions
# 2) gh-pages branch (peaceiris) — optional; use Source: Deploy from branch → gh-pages / (root)
name: Deploy leaderboard to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: leaderboard/package-lock.json

      - name: Install and build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VITE_BASE_PATH: ${{ format('/{0}/', github.event.repository.name) }}
        run: |
          set -e
          cd leaderboard
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          if [ -f public/.nojekyll ]; then cp public/.nojekyll dist/.nojekyll; else touch dist/.nojekyll; fi
          test -f dist/index.html
          ls -la dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: leaderboard/dist
          include-hidden-files: true

      - name: Mirror dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./leaderboard/dist
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
